<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101B35" />
    <meta name="description" content="LoanMitra AI - Futuristic Bilingual Loan Advisory Platform. Smart Loans. Faster Approvals." />
    
    <!-- PWA Manifest & Apple Touch -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoanMitra AI" />

    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans Tamil -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>LoanMitra AI | Smart Loans. Faster Approvals.</title>
  </head>
  <body class="bg-[#F5F7FB] dark:bg-[#0A0F1D] text-slate-800 dark:text-slate-100 min-h-screen antialiased selection:bg-electric-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped or failed in current context:', err);
          });
        });
      }
    </script>
  </body>
</html>
